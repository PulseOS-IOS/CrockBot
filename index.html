<style>

#intro svg{width:min(62vw,260px);height:auto;overflow:visible}.rb{animation:pop .95s cubic-bezier(.2,1.4,.4,1) both}.arm{transform-box:fill-box;transform-origin:0 50%;animation:wave 1s ease-in-out .9s 3}.eye{transform-box:fill-box;transform-origin:center;animation:blink 3s 1.2s infinite}

let open=null,srv=4,cat='All',q='',chat=[{r:'b',t:'Hi, I’m CrockBot. Ask for recipes, substitutions or macros.'}],busy=0,cam=null,img=null,res=null,sBusy=0,cErr='',added=0,mode='invest',lastRoute='';
